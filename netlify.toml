[build]
  # The build writes the listings into the HTML, makes a page per presenting issue,
  # and creates the sitemap. Output goes to dist/ (never edit dist/ by hand).
  publish = "dist"
  command = "node scripts/build.mjs"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# The page asks for /api/services; serve the static directory file
[[redirects]]
  from = "/api/services"
  to = "/services.json"
  status = 200

# Tidy URLs for the extra pages
[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/services.json"
  [headers.values]
    Cache-Control = "public, max-age=300"
    # Public directory data: lets the mobile apps download the latest listings
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/admin.html"
  [headers.values]
    X-Robots-Tag = "noindex"
